function normalizeDest(item, fallback) {
  const f = fallback || {};
  const weatherKeys = Object.keys(W);
  const wList = Array.isArray(item.weather)
    ? item.weather.map(x => {
        const low = String(x).toLowerCase();
        if (W[low]) return low;
        const found = weatherKeys.find(k => W[k][1].toLowerCase() === low);
        return found || "pleasant";
      })
    : (f.w || ["pleasant"]);

  const hotels = Array.isArray(item.hotels)
    ? item.hotels.map(h => [
        h.name,
        h.area || "",
        Number(h.rating) || 3,
        Number(h.pricePerNight) || 0,
        Array.isArray(h.tags) ? h.tags.join(",") : (h.tags || "")
      ])
    : (f.h || []);

  const transport = Array.isArray(item.transport)
    ? item.transport.map(t => {
        const m = String(t.mode || "").toLowerCase();
        const type = m.includes("flight") ? "flight"
          : m.includes("train") ? "train"
          : m.includes("bus") ? "bus"
          : "local";
        return [type, t.route || "", t.fareRange || "", t.duration || ""];
      })
    : (f.t || []);

  return {
    id: item.id,
    n: item.name || f.n || "",
    s: item.state || f.s || "",
    r: item.region || f.r || "North",
    e: f.e || "📍",
    img: item.image || f.img || IMG[item.id] || "",
    g: f.g || ["#0f766e", "#67e8f9"],
    w: wList,
    best: item.bestTime || f.best || "",
    why: item.summary || f.why || "",
    h: hotels,
    t: transport
  };
}

async function fetchDestinations({ weather = "", region = "", search = "" } = {}) {
  const params = new URLSearchParams();
  if (weather) params.set("weather", W[weather] ? W[weather][1] : weather);
  if (region && region !== "Anywhere in India") params.set("region", region);
  if (search) params.set("search", search);

  const qs = params.toString();
  const res = await fetch(qs ? `/api/destinations?${qs}` : "/api/destinations");
  if (!res.ok) throw new Error("API error");
  const list = await res.json();
  return list.map(item => normalizeDest(item, D.find(x => x.id === item.id)));
}
async function fetchDestinationById(id, { minRating = "", sortPrice = "", mode = "" } = {}) {
  const params = new URLSearchParams();
  if (minRating) params.set("minRating", minRating);
  if (sortPrice) params.set("sortPrice", sortPrice);
  if (mode) params.set("mode", mode);

  const qs = params.toString();
  const res = await fetch(qs ? `/api/destinations/${id}?${qs}` : `/api/destinations/${id}`);
  if (!res.ok) throw new Error("Detail API error");
  const item = await res.json();
  return normalizeDest(item, D.find(x => x.id === id));
}

async function run() {
  const q = ($("#q") || { value: "" }).value.trim().toLowerCase();
  let l;
  try {
    l = await fetchDestinations({ weather: sel.w, region: sel.r, search: q });
  } catch {
    l = D.filter(d => (!sel.w || d.w.includes(sel.w)) && (!sel.r || d.r == sel.r) && (!q || (d.n + d.s).toLowerCase().includes(q)));
  }

  let h = `<div class="sec"><h2>${sel.w || sel.r || q ? l.length + " matching destination" + (l.length == 1 ? "" : "s") : "Popular destinations"}</h2><p>${sel.w ? W[sel.w][1] + " weather" : ""}${sel.w && sel.r ? " · " : ""}${sel.r ? sel.r + " India" : ""}</p></div>`;
  if (!l.length) {
    let alt;
    try {
      alt = await fetchDestinations({ weather: sel.w });
    } catch {
      alt = D.filter(d => !sel.w || d.w.includes(sel.w));
    }
    h += `<div class="empty">No ${sel.w ? W[sel.w][1].toLowerCase() + " " : ""}destination in ${sel.r || "that search"}. Try another region, or see these ${sel.w ? W[sel.w][1].toLowerCase() + " " : ""}options elsewhere.</div><div class="grid" style="margin-top:20px">${alt.map(d => card(d, sel.w)).join("")}</div>`;
  } else {
    h += `<div class="grid">${l.map(d => card(d, sel.w)).join("")}</div>`;
  }
  $("#res").innerHTML = h;
}

  const heroBg = item.img ? `linear-gradient(120deg,rgba(9,63,59,.78),rgba(15,118,110,.62)),url('${item.img}') center/cover no-repeat` : g(item);

  app.innerHTML = `<header class="dhead" style="background:${heroBg}"><button class="back" onclick="history.length>1?history.back():location.hash=''">← Back</button><div class="em">${item.e}</div><h1>${item.n}</h1><p>${item.s} · ${item.r} India</p></header>
  <main><div class="facts"><div class="fact"><b>Best time</b>${item.best}</div><div class="fact"><b>Weather</b>${item.w.map(k => W[k][0] + " " + W[k][1]).join(", ")}</div><div class="fact"><b>Why it fits</b>${item.why}</div></div>
  <div class="sec"><h2>Where to stay</h2><p>Real, well-known hotels with approximate nightly rates.</p></div>
  <div class="bar"><select id="hs" aria-label="Sort hotels"><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="star">Rating: high to low</option></select><select id="hf" aria-label="Minimum stars"><option value="0">All ratings</option><option value="4">4★ and above</option><option value="5">5★ only</option></select></div>
  <div class="grid" id="hl"></div>
  <div class="sec" style="margin-top:40px"><h2>Getting there and around</h2><p>Fares are typical one-way estimates from a major city.</p></div>
  <div class="chips bar" id="tfc"></div><div id="tl"></div>
  <p class="note">All prices are estimates in INR for planning only. Rates vary by season, room type and booking date.</p></main>`;

  $("#hs").value = hs;
  $("#hf").value = hst;

  const hot = async () => {
    hs = $("#hs").value;
    hst = +$("#hf").value;
    const sortParam = hs === "low" ? "low-to-high" : hs === "high" ? "high-to-low" : "";
    let l = item.h;
    try {
      const filtered = await fetchDestinationById(item.id, {
        minRating: hst > 0 ? String(hst) : "",
        sortPrice: sortParam
      });
      l = filtered.h;
    } catch {}
    l = l.filter(x => x[2] >= hst);
    l.sort((a, b) => hs == "low" ? a[3] - b[3] : hs == "high" ? b[3] - a[3] : b[2] - a[2]);
    $("#hl").innerHTML = l.length
      ? l.map((x, i) => `<div class="hotel" style="animation-delay:${i * 70}ms"><h3>${x[0]}</h3><small>${ic(P.pin)} ${x[1]}</small><div class="star" aria-label="${x[2]} stars">${"★".repeat(x[2])}${"☆".repeat(5 - x[2])}</div><div class="tags">${x[4].split(",").filter(Boolean).map(a => `<span class="tag">${a}</span>`).join("")}</div><div class="price">${inr(x[3])} <small>per night, approx.</small></div>${hd(x)}</div>`).join("")
      : `<div class="empty">No hotels at that rating. Choose “All ratings”.</div>`;
  };
  $("#hs").onchange = hot;
  $("#hf").onchange = hot;
  hot();

  const tr = async () => {
    $("#tfc").innerHTML = [["all", "All"], ...Object.entries(T).map(([k, v]) => [k, v[0] + " " + v[1]])].map(([k, v]) => `<button class="chip ${tf == k ? "on" : ""}" data-k="${k}">${v}</button>`).join("");
    document.querySelectorAll("#tfc .chip").forEach(b => b.onclick = () => { tf = b.dataset.k; tr(); });
    const modeLabel = tf === "all" ? "all" : (T[tf] ? T[tf][1] : tf);
    let l = item.t;
    try {
      const filtered = await fetchDestinationById(item.id, { mode: modeLabel });
      l = filtered.t;
    } catch {}
    l = l.filter(x => tf == "all" || x[0] == tf);
    $("#tl").innerHTML = l.length
      ? l.map((x, i) => `<div class="tr" style="animation-delay:${i * 60}ms"><div class="ic">${T[x[0]][0]}</div><div><b>${T[x[0]][1]}</b><br><small>${x[1]}</small></div><div class="r"><b>${x[2].includes("₹") ? x[2] : "₹" + x[2]}</b><br><small>${ic(P.clock)} ${x[3]}</small></div></div>`).join("")
      : `<div class="empty">No ${T[tf][1].toLowerCase()} option listed for ${item.n}. Try another transport type.</div>`;
  };
  tr();
}

function route() {
  const h = location.hash.slice(1), d = D.find(x => x.id == h);
  $("#nHome").classList.toggle("on", !h);
  $("#nExp").classList.toggle("on", h == "explore");
  window.scrollTo(0, 0);
  if (d || h) detail(d || { id: h, n: h, s: "", r: "", e: "📍", img: IMG[h] || "", g: ["#0f766e", "#67e8f9"], w: ["pleasant"], best: "", why: "", h: [], t: [] });
  else if (h == "explore") explore();
  else home();
}

(function initCustomCursor(){
  const dot=$("#wfDot"),ring=$("#wfRing");
  if(!dot||!ring)return;
  let mx=-100,my=-100,rx=-100,ry=-100,active=false;
  const move=e=>{
    mx=e.clientX;my=e.clientY;
    if(!active){rx=mx;ry=my;active=true;}
    dot.style.left=mx+"px";dot.style.top=my+"px";
  };
  const tick=()=>{
    rx+=(mx-rx)*.18;ry+=(my-ry)*.18;
    ring.style.left=rx+"px";ring.style.top=ry+"px";
    requestAnimationFrame(tick);
  };
  document.addEventListener("mousemove",move,{passive:true});
  document.addEventListener("mouseover",e=>{
    document.body.classList.toggle("wf-hover",!!e.target.closest("a,button,select,input,summary,.card,.dchip,.m-item"));
  },{passive:true});
  document.addEventListener("mousedown",()=>document.body.classList.add("wf-down"),{passive:true});
  document.addEventListener("mouseup",()=>document.body.classList.remove("wf-down"),{passive:true});
  document.addEventListener("mouseleave",()=>{dot.style.opacity="0";ring.style.opacity="0";},{passive:true});
  document.addEventListener("mouseenter",()=>{dot.style.opacity="1";ring.style.opacity="1";},{passive:true});
  requestAnimationFrame(tick);
})();

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
